<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNYLIVE</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 0;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: #092756;
            background: -moz-radial-gradient(0% 100%, ellipse cover, rgba(104, 128, 138, .4) 10%, rgba(138, 114, 76, 0) 40%), -moz-linear-gradient(top, rgba(57, 173, 219, .25) 0%, rgba(42, 60, 87, .4) 100%), -moz-linear-gradient(-45deg, #670d10 0%, #092756 100%);
            background: -webkit-radial-gradient(0% 100%, ellipse cover, rgba(104, 128, 138, .4) 10%, rgba(138, 114, 76, 0) 40%), -webkit-linear-gradient(top, rgba(57, 173, 219, .25) 0%, rgba(42, 60, 87, .4) 100%), -webkit-linear-gradient(-45deg, #670d10 0%, #092756 100%);
            background: -o-radial-gradient(0% 100%, ellipse cover, rgba(104, 128, 138, .4) 10%, rgba(138, 114, 76, 0) 40%), -o-linear-gradient(top, rgba(57, 173, 219, .25) 0%, rgba(42, 60, 87, .4) 100%), -o-linear-gradient(-45deg, #670d10 0%, #092756 100%);
            background: -ms-radial-gradient(0% 100%, ellipse cover, rgba(104, 128, 138, .4) 10%, rgba(138, 114, 76, 0) 40%), -ms-linear-gradient(top, rgba(57, 173, 219, .25) 0%, rgba(42, 60, 87, .4) 100%), -ms-linear-gradient(-45deg, #670d10 0%, #092756 100%);
            background: -webkit-radial-gradient(0% 100%, ellipse cover, rgba(104, 128, 138, .4) 10%, rgba(138, 114, 76, 0) 40%), linear-gradient(to bottom, rgba(57, 173, 219, .25) 0%, rgba(42, 60, 87, .4) 100%), linear-gradient(135deg, #670d10 0%, #092756 100%);
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#3E1D6D', endColorstr='#092756', GradientType=1);
        }

        .container {
            width: 100%;
            display: grid;
            align-content: center;
            justify-content: center;
            align-items: end;
            justify-items: stretch;
        }
        

        textarea {
            font-family: monospace;
            font-family: ui-monospace;
            min-width: 90vw;
            height: 50vh;
            border: 0;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            resize: none;
            width: 100%;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            outline: none;
            padding: 10px;
            font-size: 13px;
            color: #fff;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            box-shadow: inset 0 -5px 45px rgba(100, 100, 100, 0.2), 0 1px 1px rgba(255, 255, 255, 0.2);
            -webkit-transition: box-shadow .5s ease;
            -moz-transition: box-shadow .5s ease;
            -o-transition: box-shadow .5s ease;
            -ms-transition: box-shadow .5s ease;
            transition: box-shadow .5s ease;
        }

        @media screen and (min-width: 900px) {
            textarea {
                max-width: 800px;
                min-width: 800px;
                width: 800px;
            }
        }

        textarea:focus {
            box-shadow: inset 0 -5px 45px rgba(100, 100, 100, 0.4), 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        button {
            /* display: block; */
            margin-top: 20px;
            font-size: 13px;
            padding: 10px 12px;
            border: 0;
            /* background: #00bfff;
            color: #fff; */
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn {
            display: inline-block;
            *display: inline;
            *zoom: 1;
            padding: 4px 10px 4px;
            margin-bottom: 0;
            font-size: 13px;
            line-height: 18px;
            color: #333333;
            text-align: center;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
            vertical-align: middle;
            background-color: #f5f5f5;
            background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
            background-image: -ms-linear-gradient(top, #ffffff, #e6e6e6);
            background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
            background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
            background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
            background-image: linear-gradient(top, #ffffff, #e6e6e6);
            background-repeat: repeat-x;
            filter: progid:dximagetransform.microsoft.gradient(startColorstr=#ffffff, endColorstr=#e6e6e6, GradientType=0);
            border-color: #e6e6e6 #e6e6e6 #e6e6e6;
            border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
            border: 1px solid #e6e6e6;
            -webkit-border-radius: 4px;
            -moz-border-radius: 4px;
            border-radius: 4px;
            -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
            -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            *margin-left: .3em;
        }

        .btn:hover,
        .btn:active,
        .btn.active,
        .btn.disabled,
        .btn[disabled] {
            background-color: #e6e6e6;
        }

        .btn-large {
            padding: 9px 14px;
            font-size: 15px;
            line-height: normal;
            -webkit-border-radius: 5px;
            -moz-border-radius: 5px;
            border-radius: 5px;
        }

        .btn:hover {
            color: #333333;
            text-decoration: none;
            background-color: #e6e6e6;
            background-position: 0 -15px;
            -webkit-transition: background-position 0.1s linear;
            -moz-transition: background-position 0.1s linear;
            -ms-transition: background-position 0.1s linear;
            -o-transition: background-position 0.1s linear;
            transition: background-position 0.1s linear;
        }

        .btn-primary,
        .btn-primary:hover {
            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        .btn-primary.active {
            color: rgba(255, 255, 255, 0.75);
        }

        .btn-primary {
            background-color: #4a77d4;
            background-image: -moz-linear-gradient(top, #6eb6de, #4a77d4);
            background-image: -ms-linear-gradient(top, #6eb6de, #4a77d4);
            background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#6eb6de), to(#4a77d4));
            background-image: -webkit-linear-gradient(top, #6eb6de, #4a77d4);
            background-image: -o-linear-gradient(top, #6eb6de, #4a77d4);
            background-image: linear-gradient(top, #6eb6de, #4a77d4);
            background-repeat: repeat-x;
            filter: progid:dximagetransform.microsoft.gradient(startColorstr=#6eb6de, endColorstr=#4a77d4, GradientType=0);
            border: 1px solid #3762bc;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn-primary:hover,
        .btn-primary:active,
        .btn-primary.active,
        .btn-primary.disabled,
        .btn-primary[disabled] {
            filter: none;
            background-color: #4a77d4;
        }

        .btn-block {
            width: 100%;
            display: block;
        }



        .btn-group {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .clearbtn {
            color: #e6e6e6;
            background-color: #c222ff;
            background-image: -moz-linear-gradient(top, #9466d0, #c222ff);
            background-image: -ms-linear-gradient(top, #9466d0, #c222ff);
            background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#9466d0), to(#c222ff));
            background-image: -webkit-linear-gradient(top, #9466d0, #c222ff);
            background-image: -o-linear-gradient(top, #9466d0, #c222ff);
            background-image: linear-gradient(top, #9466d0, #c222ff);
            background-repeat: repeat-x;
            filter: progid:dximagetransform.microsoft.gradient(startColorstr=#9466d0, endColorstr=#c222ff, GradientType=0);
            border: 1px solid #9466d0;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <textarea name="definition" id="urlcontent"></textarea>
        <div class="btn-group">
            <button class="btn btn-primary btn-large" onClick="submitUrl()">保存到服务器</button>
            <button class="btn-large clearbtn" onClick="clearCode()">清空</button>
        </div>
    </div>
    <script>
        // let URLpattern = new RegExp("(https|http)://([\\w-]+\\.)+[\\w-]+(/[\\w-./?%&=]*)?");
        function genURLarr() {
            let content = contentE.value + "";
            content = content.trim();
            if (content.length === 0) return [];
            content = content.replaceAll(/\[|\]|\"|\'/ig, "")
            let urlArr = content.split(",");
            return urlArr
        }
        var contentE = document.getElementById("urlcontent");
        contentE.addEventListener("blur", () => {
            let arr = genURLarr();
            if (arr.length === 0) return;
            // arr.forEach((url,index)=>{
            //     //查找字符串，并截断
            //     let addr = url.search(/(http|https):/);
            //     if(addr === -1){
            //         return
            //     }
            //     url = url.substr(addr)
            //     arr[index] = url;
            // })
            contentE.value = arr;
            cleanCode()
        })
        function clearCode() {
            let timer = null;
            timer = setInterval(() => {
                let content = contentE.value + "";
                if (content.length === 0) {
                    clearInterval(timer);
                    return
                }
                let index = content.indexOf(",")
                if (index === -1) {
                    contentE.value = "";
                    return
                }
                contentE.value = content.substr(index + 1);
            })
        }
        function cleanCode() {
            for (var n = 0; n <= 1; n++) {
                var arr = new Array();
                var tab = "";
                // create array
                code = contentE.value;
                code = code.split("\n");
                // trim and remove blank array
                code = code.map(Function.prototype.call, String.prototype.trim);
                code = code.filter(Boolean);
                //result.value=code;
                for (var i = 0; i < code.length; i++) {
                    if (i < (code.length - 1)) {
                        if (code[i + 1].trim().substring(0, 1) == "{") {
                            code[i] = code[i] + "{";
                            code[i + 1] = code[i + 1].trim().substring(1);
                            //code.splice(i, 1);
                        }
                    }
                    // remove line break and double space trim
                    code[i] = code[i].replace(/(\r\n|\n|\r)/gm, " ").replace(/\s{2,}/g, "").trim();
                    code[i] = code[i].replace(/(?![^(]*\))({| {)/g, "{\n")
                        .replace(/(?![^(]*\))(})/g, "\n}\n")
                        .replace(/(?![^(]*\))( \()/g, "(")
                        .replace(/(?![^(]*\))(; )/g, ";")
                        .replace(/(?![^(]*\))(;)/g, ";\n")
                        .replace(/(\. )((?=([^"]*"[^"]*")*[^"]*$)(?=([^']*'[^']*')*[^']*$))/g, ".")
                        .replace(/( \.)((?=([^"]*"[^"]*")*[^"]*$)(?=([^']*'[^']*')*[^']*$))/g, ".");
                    // make array for code[i] to proccess again
                    var ncode = code[i].split("\n");

                    // create delete tabulation
                    if (i > 0) {
                        if (code[i - 1].substring(code[i - 1].length - 1) == "{") {
                            tab = tab + "\t";
                        }
                        if (code[i].substring(0, 1) == "}") {
                            tab = tab.substring(1);
                        }
                    }


                    // remove all falsy values: undefined, null, 0, false, NaN and "" (empty string)
                    code[i] = code[i].replace(/(\r\n|\n|\r)/gm, "").trim();
                    if (ncode.length > 2) {
                        for (var c = 0; c < ncode.length; c++) {
                            if (c < (ncode.length - 1)) {
                                if (ncode[c + 1].trim().substring(0, 1) == "{") {
                                    ncode[c] = ncode[i] + "{";
                                    ncode[c + 1] = ncode[c + 1].trim().substring(1);
                                }
                            }
                            // create delete tabulation
                            if (c > 0) {
                                if (ncode[c - 1].substring(ncode[c - 1].length - 1) == "{") {
                                    tab = tab + "\t";
                                }
                                if (ncode[c].substring(0, 1) == "}") {
                                    tab = tab.substring(1);
                                }
                            }
                            // remove all falsy values: undefined, null, 0, false, NaN and "" (empty string)
                            ncode[c] = ncode[c].replace(/(\r\n|\n|\r)/gm, "").trim();
                            if (ncode[c]) {
                                arr.push(tab + ncode[c]);
                            }
                        }
                        //continue;
                    } else if (code[i]) {
                        arr.push(tab + code[i]);
                    }
                }
                contentE.value = arr.join("\n");
            }
            //return arr.join("\n");
            contentE.value = arr.join("\n");
        }

        function submitUrl() {
            let urlArr = genURLarr();
            if (urlArr.length === 0) return;
            let data = { urls: urlArr };
            new Promise((resolve, reject) => {
                fetch('/admin/addUrl', {
                    method: 'post',
                    body: JSON.stringify(data),
                }).then(response => {
                    if (response.status === 200) return response.json()
                    reject(response)
                })
                    .then((data) => {
                        if (data.code === 200 || data.success) {
                            resolve(data)
                        } else {
                            reject(data)
                        }
                    }).catch(err => {
                        reject(err)
                    })
            }).then((data) => {
                console.log(data)
                alert(data.message)
                // Message(data.message)
            }).catch(err => {
                console.log(err)
            })
        }
    </script>
</body>

</html>
